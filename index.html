    <!-- CSS -->
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            flex-direction: column;
            transition: background-color 0.5s ease;
            position: relative;
        }
        .message {
            font-size: 2rem;
            color: #333;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            margin-top: 20px;
            cursor: pointer;
        }
        body.saturday {
            background-color: #ffeb3b;
        }
        .message.saturday {
            font-size: 3rem;
            color: #4caf50;
            animation: pulse 0.3333s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        /* Fireworks styles */
        .fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 9999;
        }
        .firework {
            position: absolute;
            border-radius: 50%;
            background: radial-gradient(circle, #ffcc00, transparent);
            animation: firework 2s ease-out forwards;
        }
        @keyframes firework {
            0% {
                transform: scale(0);
                opacity: 1;
            }
            100% {
                transform: scale(3);
                opacity: 0;
            }
        }
        /* Mute/Unmute Icon Styles */
        .mute-icon {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 30px;
            height: 30px;
            cursor: pointer;
            fill: #333;
            transition: fill 0.3s;
            display: none; /* Hide the mute icon by default */
        }
        .mute-icon:hover {
            fill: #666;
        }
    </style>
</head>
<body>
    <h1 class="message"></h1>
    <div class="fireworks"></div>
    <button id="simulateSaturday" style="display: none;" onclick="simulateSaturday()">शनिवार आज़माएं</button>

    <!-- Mute/Unmute Icon -->
    <svg id="muteButton" class="mute-icon" viewBox="0 0 24 24" aria-label="Mute/Unmute" role="button" tabindex="0">
        <path id="muteIconPath" d="M12 4.44L9.94 6.5L12 8.56V4.44 M3 9v6h4l5 5V4L7 9H3z"></path>
    </svg>

    <!-- Audio Element -->
    <audio id="backgroundMusic" loop preload="auto">
        <source src="background.mp3" type="audio/mpeg">
        आपका ब्राउज़र ऑडियो तत्व का समर्थन नहीं करता है।
    </audio>

    <script>
        const today = new Date();
        const day = today.getDay();
        const message = document.querySelector('.message');
        const body = document.body;
        const simulateButton = document.getElementById('simulateSaturday');
        const muteButton = document.getElementById('muteButton');
        const muteIconPath = document.getElementById('muteIconPath');
        const backgroundMusic = document.getElementById('backgroundMusic');

        const unmuteIcon = "M3 9v6h4l5 5V4l-5 5H3zm13.5 3c0-2.5-1.56-4.67-3.78-5.53L10.5 8.06v7.88l2.22 2.22C14.94 16.67 16.5 14.5 16.5 12zm3 0c0-3.58-2.2-6.63-5.34-7.75L13.5 6.1C16.12 7.1 18 9.4 18 12s-1.88 4.9-4.5 5.9l.66.66c3.14-1.12 5.34-4.17 5.34-7.75z";
        const muteIcon = "M16.5 12c0-2.5-1.56-4.67-3.78-5.53L10.5 8.06v7.88l2.22 2.22C14.94 16.67 16.5 14.5 16.5 12zm3 0c0-3.58-2.2-6.63-5.34-7.75L13.5 6.1C16.12 7.1 18 9.4 18 12s-1.88 4.9-4.5 5.9l.66.66c3.14-1.12 5.34-4.17 5.34-7.75zM12 4.44L9.94 6.5L12 8.56V4.44zM3 9v6h4l5 5V4l-5 5H3z";

        backgroundMusic.muted = true;
        muteButton.style.display = "none"; // Hide the mute button by default

        if (day === 6) {
            message.innerText = "शनिवार है!!";
            simulateButton.style.display = 'none';
            startCelebration();
        } else {
            message.innerText = "शनिवार नहीं है :(";
            simulateButton.style.display = 'block';
        }

        simulateButton.addEventListener('click', () => {
            message.innerText = "शनिवार है!!";
            simulateButton.style.display = 'none';
            startCelebration();
        });

        muteButton.addEventListener('click', () => {
            backgroundMusic.muted = !backgroundMusic.muted;
            muteIconPath.setAttribute('d', backgroundMusic.muted ? unmuteIcon : muteIcon);
        });

        function startCelebration() {
            message.classList.add('saturday');
            body.classList.add('saturday');
            muteButton.style.display = 'block'; // Show mute button only on Saturday
            setInterval(createFirework, 500);
        }

        function createFirework() {
            const firework = document.createElement('div');
            firework.className = 'firework';
            firework.style.width = `${Math.random() * 50 + 50}px`;
            firework.style.height = `${Math.random() * 50 + 50}px`;
            firework.style.top = `${Math.random() * 100}vh`;
            firework.style.left = `${Math.random() * 100}vw`;
            document.querySelector('.fireworks').appendChild(firework);
            setTimeout(() => firework.remove(), 2000);
        }
    </script>
</body>
